<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Add bill')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('bills')}"></header>
<main>
    <div class="page-head"><h1>Add a bill manually</h1></div>
    <section class="card">
        <form class="form" th:action="@{/bills}" th:object="${form}" method="post" novalidate>
            <th:block th:replace="~{fragments/bill-form :: fields}"></th:block>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Save bill</button>
                <a class="btn" th:href="@{/bills}">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
