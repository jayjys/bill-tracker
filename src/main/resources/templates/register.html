<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<div class="auth">
    <div th:replace="~{fragments/auth-side :: side}"></div>
    <main class="auth-main">
        <div class="auth-card">
            <h1>Create your account</h1>
            <div th:if="${inviteHousehold}" class="alert" th:text="|You've been invited to join ${inviteHousehold}.|">Invited</div>
            <form class="form" th:action="@{/register}" th:object="${form}" method="post" novalidate>
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                </div>
                <div th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" autocomplete="username" required>
                    <div class="field-error" th:errors="*{email}"></div>
                </div>
                <div>
                    <label for="displayName">Name <span class="muted">(optional)</span></label>
                    <input type="text" id="displayName" th:field="*{displayName}" autocomplete="name">
                </div>
                <div th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" autocomplete="new-password" required>
                    <div class="field-error" th:errors="*{password}"></div>
                </div>
                <div th:classappend="${#fields.hasErrors('passwordConfirmed')} ? 'has-error'">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password" required>
                    <div class="field-error" th:errors="*{passwordConfirmed}"></div>
                </div>
                <input type="hidden" th:field="*{invite}">
                <button type="submit" class="btn btn-primary">Create account</button>
            </form>
            <p class="muted small auth-foot">Already have an account? <a th:href="@{/login}">Sign in</a></p>
        </div>
    </main>
</div>
</body>
</html>
