# Render Blueprint for the public demo: New → Blueprint → pick this repo.
# Runs the `demo` profile: an in-memory database seeded with the demo household, reset on every restart,
# so the free plan needs no Postgres. For a real deployment with PostgreSQL, see "Deploying" in the README.
services:
  - type: web
    name: bill-tracker
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: INBOUND_EMAIL_SECRET
        generateValue: true
