# Full stack locally:  docker compose up --build   →  http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billtracker
      POSTGRES_USER: billtracker
      POSTGRES_PASSWORD: billtracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billtracker"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/billtracker
      DATABASE_USERNAME: billtracker
      DATABASE_PASSWORD: billtracker
      INBOUND_EMAIL_DOMAIN: inbound.localhost
      INBOUND_EMAIL_SECRET: local-dev-secret
    ports:
      - "8080:8080"

volumes:
  pgdata:
